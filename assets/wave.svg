<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Mão acenando">
  <style>
    .hand { transform-origin: 20px 32px; animation: wave 2.6s ease-in-out infinite; }
    @keyframes wave {
      0%, 55%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(-14deg); }
      20% { transform: rotate(10deg); }
      30% { transform: rotate(-12deg); }
      40% { transform: rotate(8deg); }
      48% { transform: rotate(-4deg); }
    }
    @media (prefers-reduced-motion: reduce) { .hand { animation: none; } }
  </style>
  <text class="hand" x="20" y="31" font-size="32" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👋</text>
</svg>
