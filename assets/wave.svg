<svg xmlns="http://www.w3.org/2000/svg" width="47" height="40" viewBox="-4 0 56 48" role="img" aria-label="Mão acenando">
  <style>
    .hand { transform-origin: 24px 44px; animation: wave 2.6s ease-in-out infinite; }
    .arc { animation: arc 2.6s ease-in-out infinite; }
    @keyframes wave {
      0%, 55%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(-16deg); }
      20% { transform: rotate(12deg); }
      30% { transform: rotate(-14deg); }
      40% { transform: rotate(10deg); }
      48% { transform: rotate(-6deg); }
    }
    @keyframes arc { 0%, 55%, 100% { opacity: 0; } 12%, 42% { opacity: 0.8; } }
    @media (prefers-reduced-motion: reduce) { .hand, .arc { animation: none; } .arc { opacity: 0.8; } }
  </style>
  <g class="arc" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round">
    <path d="M42 8 q4 5 0 10"/>
    <path d="M45.5 5 q6 8 0 16"/>
  </g>
  <g class="hand" fill="#ffd24d" stroke="#d99a14" stroke-width="1.3">
    <rect x="14" y="9" width="5.6" height="24" rx="2.8"/>
    <rect x="20" y="5" width="5.6" height="28" rx="2.8"/>
    <rect x="26" y="8" width="5.6" height="25" rx="2.8"/>
    <rect x="32" y="14" width="5.4" height="20" rx="2.7"/>
    <rect x="13" y="24" width="25" height="19" rx="9.5"/>
    <rect x="7.5" y="23" width="5.8" height="17" rx="2.9" transform="rotate(-34 12 40)"/>
  </g>
</svg>
