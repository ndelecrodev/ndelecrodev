<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Nicolas Delecrode Zampieri, desenvolvedor de software em São Paulo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#102a5c"/>
      <stop offset="1" stop-color="#2f6feb"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5c8ff"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#58a6ff" stop-opacity=".45"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="900" height="230" rx="14"/></clipPath>
  </defs>
  <style>
    .g1 { animation: drift1 14s ease-in-out infinite alternate; }
    .g2 { animation: drift2 18s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(180px,30px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-200px,-20px); } }
    .hand { transform-origin: 490px 80px; animation: wave 2.6s ease-in-out infinite; }
    @keyframes wave {
      0%, 55%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(-14deg); } 20% { transform: rotate(10deg); }
      30% { transform: rotate(-12deg); } 40% { transform: rotate(8deg); } 48% { transform: rotate(-4deg); }
    }
    .ring { fill: none; stroke: #ffffff; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; }
    .r1 { opacity: .52; animation: spin 40s linear infinite; }
    .r2 { opacity: .38; animation: spin 60s linear infinite reverse; }
    .r3 { opacity: .65; animation: pulse 5s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .65; } 50% { transform: scale(1.08); opacity: .28; } }
    .rise { animation: rise 1.1s ease-out both; }
    .rise2 { animation: rise 1.1s .25s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .g1,.g2,.hand,.rise,.rise2,.r1,.r2,.r3 { animation: none; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="900" height="230" fill="url(#bg)"/>
    <g opacity=".08" stroke="#fff">
      <path d="M0 57.5H900M0 115.5H900M0 173.5H900"/>
      <path d="M150 0V230M300 0V230M450 0V230M600 0V230M750 0V230"/>
    </g>
    <circle class="ring r1" cx="868" cy="115" r="150" stroke-dasharray="3 9"/>
    <circle class="ring r2" cx="868" cy="115" r="108" stroke-dasharray="14 10"/>
    <circle class="ring r3" cx="868" cy="115" r="66"/>
    <circle class="g1" cx="150" cy="60" r="190" fill="url(#glow)"/>
    <circle class="g2" cx="760" cy="190" r="210" fill="url(#glow)"/>
  </g>
  <g font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" text-anchor="middle">
    <g class="rise">
      <text x="404" y="84" font-size="22" fill="#c9d9f5" textLength="64" lengthAdjust="spacingAndGlyphs" text-anchor="start">Hi, I'm</text>
    </g>
    <text class="hand" x="478" y="86" font-size="24" text-anchor="start" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👋</text>
    <text class="rise" x="450" y="134" font-size="46" font-weight="700" fill="url(#name)" textLength="720" lengthAdjust="spacingAndGlyphs">Nicolas Delecrode Zampieri</text>
    <text class="rise2" x="450" y="176" font-size="19" fill="#c9d9f5" letter-spacing="1.2">DESENVOLVEDOR DE SOFTWARE  ·  SÃO PAULO, SP</text>
  </g>
</svg>
